# Builds the packages on every push and pull request. A tag vX.Y.Z also
# publishes them as a GitHub release, with the notes from CHANGELOG.md.
name: Packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NFPM_VERSION: 2.48.0

jobs:
  packages:
    runs-on: ubuntu-latest
    # Debian 12: an old glibc, so the binary also runs on newer distributions.
    container: debian:bookworm
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential clang libclang-dev \
            pkg-config libpipewire-0.3-dev
          curl -sSfL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          apt-get install -y /tmp/nfpm.deb

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          }

      - name: Test
        run: cargo test --locked

      - name: Build the packages
        run: packaging/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/sound-cast*
            dist/SHA256SUMS

      - name: Extract the release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: dist/notes.md
          files: |
            dist/sound-cast*
            dist/SHA256SUMS
