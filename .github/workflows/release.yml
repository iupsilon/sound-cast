# Builds the packages for x86-64 and ARM64 on every push and pull request. A
# tag vX.Y.Z also publishes them as one GitHub release, with the notes from
# CHANGELOG.md, once both are built.
name: Packages

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  NFPM_VERSION: 2.48.0

jobs:
  packages:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Debian 12: an old glibc, so the binary also runs on newer distributions.
    container: debian:bookworm
    env:
      NFPM_ARCH: ${{ matrix.arch }}
    steps:
      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential clang libclang-dev \
            pkg-config libpipewire-0.3-dev
          curl -sSfL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_${NFPM_ARCH}.deb"
          apt-get install -y /tmp/nfpm.deb

      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          }

      - name: Test
        run: cargo test --locked

      - name: Build the packages
        run: packaging/package.sh

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          path: |
            dist/sound-cast*
            dist/SHA256SUMS*

  # One release with the packages of both architectures, once both are built.
  release:
    needs: packages
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Extract the release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            /^## / { on = index($0, "[" v "]") > 0; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/sound-cast*
            dist/SHA256SUMS*
