[package]
name = "sound-cast"
version = "0.1.0"
edition = "2024"
description = "Plays desktop audio on Chromecast speakers, one PipeWire sink per room"
license = "GPL-3.0-or-later"
repository = "https://github.com/iupsilon/sound-cast"
readme = "README.md"
keywords = ["chromecast", "pipewire", "audio", "cast"]
categories = ["multimedia::audio"]

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
mdns-sd = "0.21.7"
pipewire = "0.10.1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0.154"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
